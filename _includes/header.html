<header class="site-header">
  <div class="wrapper">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      {%- assign nav_pages = site.pages | where_exp: "p", "p.title" | sort: "nav_order" -%}
      {%- for p in nav_pages -%}
        {%- unless p.url == "/404.html" or p.nav_exclude -%}
          <a class="page-link" href="{{ p.url | relative_url }}">{{ p.title }}</a>
        {%- endunless -%}
      {%- endfor -%}
    </nav>
  </div>
</header>
