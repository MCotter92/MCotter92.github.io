{%- comment -%}
  Renders a post's tags as links to their section on the tags page.
  Usage: {% include post-tags.html tags=post.tags %}
{%- endcomment -%}
{%- if include.tags and include.tags.size > 0 -%}
  <span class="post-tags">
    {%- for tag in include.tags -%}
      <a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag | escape }}</a>
    {%- endfor -%}
  </span>
{%- endif -%}
