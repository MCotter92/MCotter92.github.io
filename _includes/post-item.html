{%- comment -%}
  One row of a post list: date, title, tags.
  Usage: {% include post-item.html post=post %}
{%- endcomment -%}
<li>
  <time class="post-meta" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time>
  <a class="post-link" href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a>
  {% include post-tags.html tags=include.post.tags %}
</li>
