<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">

  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="icon" type="image/png" href="{{ '/assets/icons/icon-192.png' | relative_url }}" sizes="192x192">
