---
layout: default
---
<div class="home">
  {{ content }}

  {%- if site.posts.size > 0 -%}
    <h2 class="post-list-heading">Posts</h2>
    <ul class="post-list">
      {%- for post in site.posts -%}
        {% include post-item.html post=post %}
      {%- endfor -%}
    </ul>
  {%- endif -%}
</div>
